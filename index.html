<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regional São Paulo — CCIB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇮🇳</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="dash-root">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-logo-box"><img src="assets/logo.png" alt="India Brazil Chamber of Commerce — São Paulo Region"/></div>
    </div>
    <div id="nav"></div>
    <div class="sidebar-footer">Regional São Paulo<br/>Pedro Oliveira &amp; Rafaela</div>
  </div>
  <div class="main">
    <div class="topbar">
      <div>
        <h2 id="page-title">Visão Geral</h2>
        <p id="page-sub">Painel de gestão da Regional São Paulo</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="sync-tag" id="sync-tag">nunca sincronizado</span>
        <button class="btn btn-accent btn-sm" id="btn-quick-task">+ Tarefa</button>
        <button class="btn btn-ghost btn-sm" id="btn-sync-all">ℹ Atualização dos dados</button>
      </div>
    </div>

    <div id="error-banner-holder"></div>

    <div class="filterbar">
      <div class="fgroup"><label>Tipo</label><select id="f-cat"><option value="">Todos</option><option>Associação</option><option>Serviços</option></select></div>
      <div class="fgroup"><label>Responsável</label><select id="f-resp"><option value="">Todos</option><option value="pedro">Pedro</option><option value="rafaela">Rafaela</option><option value="ambos">Pedro e Rafaela</option></select></div>
      <div class="fgroup"><label>Período</label><select id="f-periodo"><option value="0">Todo o histórico</option><option value="7">Últimos 7 dias</option><option value="30">Últimos 30 dias</option><option value="90">Últimos 90 dias</option></select></div>
      <div class="spacer"></div>
      <div class="fgroup"><input type="text" id="f-busca" placeholder="Buscar empresa, pessoa, e-mail..." style="width:230px;"/></div>
    </div>

    <div id="tabs"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="drawer-root"></div>
<script src="js/app.js"></script>
</body>
</html>
